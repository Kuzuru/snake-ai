[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "snake-ai"
version = "0.1.0"
description = "Snake game AI using Dueling Double DQN with Prioritized Experience Replay"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10.0",
    "numpy>=1.26.0",
    "pygame>=2.5.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["snake_ai*"]
